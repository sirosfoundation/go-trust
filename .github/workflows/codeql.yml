name: "CodeQL"

# No paths-ignore. The default branch's ruleset requires a CodeQL result on
# every pull request, and a rule cannot be scoped to a path - so skipping this
# workflow for documentation does not make such a pull request cheap, it makes
# it unmergeable: every check it does run goes green and the merge stays
# BLOCKED, waiting for an analysis that was never going to start. That is what
# happened to the release-notes bot's pull requests, which touch RELEASE_NOTES.md
# and nothing else, and which someone then had to merge with an admin bypass
# every release. Analysing a documentation change wastes a couple of minutes;
# not analysing it costs a bypass on the default branch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1' # Run every Monday at 8:00 AM

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"